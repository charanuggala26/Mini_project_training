<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUDflix</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="hero">
    <h1>CRUDflix</h1>
    <p>Keep your favourite movies in one place.</p>
  </header>

  <div class="toolbar">
    <input
      id="search"
      type="search"
      placeholder="Search movies..."
      aria-label="Search movies"
    >
    <select id="genreFilter"></select>
    <select id="sortBy" aria-label="Sort movies">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="rating">Highest rated</option>
      <option value="title">Title A-Z</option>
    </select>
    <button id="addBtn" class="primary">+ Add Movie</button>
  </div>

  <main id="grid" class="grid"></main>

  <dialog id="dialog">
    <form id="movieForm" novalidate>
      <h2 id="formTitle"></h2>
      <input id="title" placeholder="Movie title">
      <select id="genre"></select>
      <input id="language" placeholder="Language (e.g. Hindi)">
      <input id="releaseYear" type="number" placeholder="Release year">
      <input
        id="rating"
        type="number"
        step="0.1"
        placeholder="Rating (0-10)"
      >
      <input id="duration" placeholder="Duration (e.g. 150 min)">
      <textarea id="description" rows="3" placeholder="Short description"></textarea>
      <input id="poster" placeholder="Poster image URL (optional)">
      <div class="form-actions">
        <button class="primary">Save movie</button>
        <button type="button" id="cancelBtn">Cancel</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailsDialog">
    <h2 id="detailsTitle"></h2>
    <div id="detailsContent" class="details-content"></div>
    <button id="closeDetailsBtn">Close</button>
  </dialog>

  <script type="module" src="../js/main.js"></script>
</body>
</html>
