<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRUDflix</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <div class="logo">
            🎬 CRUDflix
        </div>

        <nav class="nav-links">
            <a href="#movies">Movies</a>
            <a href="#manage">Manage Movies</a>
        </nav>

    </header>


    <main>

        <!-- Hero -->
        <section class="hero">

            <div class="hero-content">
                <h1>Find Your Next Favorite Movie</h1>

                <p>
                    Discover movies, explore genres, and manage your collection.
                </p>
            </div>

        </section>


        <!-- Search and Filters -->
        <section class="movie-controls">

            <input
                type="text"
                id="searchInput"
                placeholder="Search movies..."
            >

            <select id="genreFilter">

                <option value="">All Genres</option>
                <option value="Action">Action</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Romance">Romance</option>
                <option value="Thriller">Thriller</option>
                <option value="Sci-Fi">Sci-Fi</option>

            </select>


            <select id="ratingSort">

                <option value="">Sort by Rating</option>
                <option value="high">Highest Rating</option>
                <option value="low">Lowest Rating</option>

            </select>

        </section>


        <!-- Message -->
        <div id="statusMessage" class="status-message"></div>


        <!-- Movies -->
        <section id="movies" class="movies-section">

            <div class="section-header">
                <h2>Explore Movies</h2>
            </div>

            <div id="movieList" class="movie-grid"></div>

        </section>


        <!-- Manage Movies -->
        <section id="manage" class="manage-section">

            <div class="section-header">

                <h2>Manage Movies</h2>

                <button id="showFormBtn">
                    + Add Movie
                </button>

            </div>


            <!-- Movie Form -->
            <form id="movieForm" class="movie-form">

                <h3 id="formTitle">
                    Add New Movie
                </h3>


                <input
                    type="text"
                    id="title"
                    placeholder="Movie Title"
                    required
                >


                <select id="genre" required>

                    <option value="">
                        Select Genre
                    </option>

                    <option value="Action">
                        Action
                    </option>

                    <option value="Comedy">
                        Comedy
                    </option>

                    <option value="Drama">
                        Drama
                    </option>

                    <option value="Romance">
                        Romance
                    </option>

                    <option value="Thriller">
                        Thriller
                    </option>

                    <option value="Sci-Fi">
                        Sci-Fi
                    </option>

                </select>


                <input
                    type="text"
                    id="language"
                    placeholder="Language"
                    required
                >


                <input
                    type="number"
                    id="releaseYear"
                    placeholder="Release Year"
                    min="1900"
                    max="2100"
                    required
                >


                <input
                    type="number"
                    id="rating"
                    placeholder="Rating (0 - 10)"
                    min="0"
                    max="10"
                    step="0.1"
                    required
                >


                <input
                    type="text"
                    id="duration"
                    placeholder="Duration (e.g. 150 min)"
                    required
                >


                <input
                    type="url"
                    id="poster"
                    placeholder="Poster URL"
                    required
                >


                <textarea
                    id="description"
                    placeholder="Movie Description"
                    required
                ></textarea>


                <div class="form-actions">

                    <button
                        type="submit"
                        id="submitMovieBtn"
                    >
                        Add Movie
                    </button>


                    <button
                        type="button"
                        id="cancelEditBtn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- Movie Details Modal -->
    <div id="movieModal" class="modal">

        <div class="modal-content">

            <button
                id="closeModalBtn"
                class="close-btn"
            >
                ×
            </button>

            <div id="movieDetails"></div>

        </div>

    </div>


    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Main JavaScript -->
    <script
        type="module"
        src="../js/main.js"
    ></script>

</body>

</html>
